# SHODAN Stat Editor Offline: the development build. Every push to main is built (LuaJIT at the commit the
# releases use, libsodium.dll from a release zip, as libsodium re-publishes its -stable download) and published as the "Development build" pre-release (tag: dev),
# which SSEO follows with Settings > Update channel > Every commit. Pushes to ci/* branches only build (the zip
# is kept as the run's artifact). Releases are not touched: the updater's Releases channel skips pre-releases.
name: Development build

on:
  push:
    branches: [main, 'ci/**']

permissions:
  contents: write

concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

env:
  LUAJIT_COMMIT: a4c064539ea931274d407e1249b4bb575424a0f4
  LIBSODIUM_RELEASE: v4.1.0
  LIBSODIUM_DLL_SHA256: 396501C7495E4B03D0F8ACB2416F3E2431B0CDC404968E17CC0E25C2ABC5CA27

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Get LuaJIT and libsodium
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --quiet https://github.com/LuaJIT/LuaJIT.git "$env:RUNNER_TEMP\LuaJIT"
          git -C "$env:RUNNER_TEMP\LuaJIT" checkout --quiet $env:LUAJIT_COMMIT
          gh release download $env:LIBSODIUM_RELEASE --pattern "SHODAN-Stat-Editor-Offline-$env:LIBSODIUM_RELEASE.zip" --output "$env:RUNNER_TEMP\sodium.zip"
          if ($LASTEXITCODE -ne 0) { throw "could not download the $env:LIBSODIUM_RELEASE release zip" }
          Expand-Archive "$env:RUNNER_TEMP\sodium.zip" "$env:RUNNER_TEMP\sodium"
          New-Item -ItemType Directory -Force offline\runtime | Out-Null
          Copy-Item "$env:RUNNER_TEMP\sodium\SHODAN Stat Editor Offline\libsodium.dll" offline\runtime\
          $hash = (Get-FileHash offline\runtime\libsodium.dll -Algorithm SHA256).Hash
          if ($hash -ne $env:LIBSODIUM_DLL_SHA256) { throw "libsodium.dll is not the build the releases ship: $hash" }

      - name: Build LuaJIT, the launcher and shodan_hash.dll
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VS=%%i"
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          rem the debug record names the .pdb only (no build folder path in the DLL)
          set "LINK=/PDBALTPATH:%%_PDB%%"
          cd /d "%RUNNER_TEMP%\LuaJIT\src"
          rem msvcbuild runs the tools it builds from its own folder
          set NoDefaultCurrentDirectoryInExePath=
          set "PATH=.;%PATH%"
          call "%CD%\msvcbuild.bat" || exit /b 1
          set "LINK="
          copy /y lua51.dll "%GITHUB_WORKSPACE%\offline\runtime\" || exit /b 1
          set "LJ=%RUNNER_TEMP%\LuaJIT\src"
          call "%GITHUB_WORKSPACE%\offline\launcher\build.bat"
          if not exist "%GITHUB_WORKSPACE%\offline\launcher\SHODAN Stat Editor Offline.exe" exit /b 1
          if not exist "%GITHUB_WORKSPACE%\offline\launcher\shodan_hash.dll" exit /b 1

      - name: Package
        shell: pwsh
        env:
          SSEO_CHANNEL: dev
          SSEO_COMMIT: ${{ github.sha }}
        run: |
          $name = "SHODAN-Stat-Editor-Offline-dev-" + $env:SSEO_COMMIT.Substring(0, 12)
          python offline/package.py $name
          if ($LASTEXITCODE -ne 0) { throw "package.py failed" }
          "ZIP=offline/release/$name.zip" >> $env:GITHUB_ENV

      - name: Keep the zip (ci/* branches)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: development-build
          path: ${{ env.ZIP }}

      - name: Publish the Development build (main)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev --cleanup-tag --yes 2>$null
          $global:LASTEXITCODE = 0
          $notes = "The latest commit to main ($env:GITHUB_SHA), built automatically and not tested yet: it may break. " +
                   "Tested versions are the releases. In SHODAN Stat Editor Offline, Settings > Update channel > " +
                   "Every commit follows this build."
          gh release create dev $env:ZIP --prerelease --target $env:GITHUB_SHA --title "Development build" --notes $notes
